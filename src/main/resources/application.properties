# Configuración del servidor web en el puerto 8080
server.port=8081

# Conexión a la base de datos MySQL (Administrador de Mascotas)
spring.datasource.url=jdbc:mysql://localhost:3306/administrador_mascotas?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Thymeleaf (desactivar caché para ver cambios al instante en desarrollo)
spring.thymeleaf.cache=false