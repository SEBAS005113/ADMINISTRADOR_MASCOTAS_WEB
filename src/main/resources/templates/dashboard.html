<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Veterinaria</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Barra Superior -->
        <div class="bg-white rounded-2xl shadow-md p-6 flex justify-between items-center border-2 border-sky-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-700">Panel Principal 🏥</h1>
                <p class="text-sm text-slate-500">Sistema de Gestión Veterinaria</p>
            </div>
            <a href="/logout" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold py-2 px-4 rounded-lg shadow transition">
                Cerrar Sesión 🚪
            </a>
        </div>

        <!-- Tarjetas de Resumen (KPIs) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-sky-500">
                <p class="text-xs font-bold text-slate-400 uppercase">Total Mascotas</p>
                <h3 class="text-3xl font-extrabold text-slate-700 mt-2" th:text="${totalMascotas}">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-emerald-500">
                <p class="text-xs font-bold text-slate-400 uppercase">Citas para Hoy</p>
                <h3 class="text-3xl font-extrabold text-slate-700 mt-2">--</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-amber-500">
                <p class="text-xs font-bold text-slate-400 uppercase">Inventario Activo</p>
                <h3 class="text-3xl font-extrabold text-slate-700 mt-2">--</h3>
            </div>
        </div>

        <!-- Módulos de Navegación del Sistema -->
        <div class="bg-white rounded-2xl shadow-md p-6 border-2 border-sky-100">
            <h2 class="text-lg font-bold text-slate-700 mb-4">Módulos del Sistema</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <!-- Módulo de Mascotas -->
                <a href="/" class="p-4 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-xl transition flex flex-col items-center text-center shadow-sm">
                    <span class="text-3xl mb-2">🐶🐱</span>
                    <span class="font-bold text-sky-900">Mascotas</span>
                    <span class="text-xs text-slate-500 mt-1">CRUD y Excel</span>
                </a>
                
                <!-- Módulo de Propietarios -->
                <a href="/propietarios" class="p-4 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-xl transition flex flex-col items-center text-center shadow-sm">
                    <span class="text-3xl mb-2">👥</span>
                    <span class="font-bold text-sky-900">Propietarios</span>
                    <span class="text-xs text-slate-500 mt-1">Dueños</span>
                </a>

                <!-- Módulo de Historial Clínico -->
                <a href="/historial" class="p-4 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-xl transition flex flex-col items-center text-center shadow-sm">
                    <span class="text-3xl mb-2">🩺</span>
                    <span class="font-bold text-sky-900">Historial</span>
                    <span class="text-xs text-slate-500 mt-1">Consultas</span>
                </a>

                <!-- Módulo de Citas -->
                <a href="/citas" class="p-4 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-xl transition flex flex-col items-center text-center shadow-sm">
                    <span class="text-3xl mb-2">📅</span>
                    <span class="font-bold text-sky-900">Citas</span>
                    <span class="text-xs text-slate-500 mt-1">Agenda</span>
                </a>

                <!-- Módulo de Inventario -->
                <a href="/inventario" class="p-4 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-xl transition flex flex-col items-center text-center shadow-sm">
                    <span class="text-3xl mb-2">📦</span>
                    <span class="font-bold text-sky-900">Inventario</span>
                    <span class="text-xs text-slate-500 mt-1">Farmacia</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
