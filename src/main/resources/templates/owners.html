<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Propietarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Cabecera -->
        <div class="bg-white rounded-2xl shadow-md p-6 flex justify-between items-center border-2 border-sky-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-700">Módulo de Propietarios 👥</h1>
                <p class="text-sm text-slate-500">Administración de Dueños de Mascotas</p>
            </div>
            <div class="flex space-x-3">
                <a href="/dashboard" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-2 px-4 rounded-lg transition">
                    ⬅️️ Volver al Dashboard
                </a>
                <a href="/logout" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold py-2 px-4 rounded-lg shadow transition">
                    Cerrar Sesión 🚪
                </a>
            </div>
        </div>

        <!-- Formulario y Tabla -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Formulario de Registro -->
            <div class="bg-white p-6 rounded-2xl shadow-md border-2 border-sky-100 space-y-4">
                <h2 class="text-lg font-bold text-slate-700 border-b pb-2">Nuevo Propietario</h2>
                <form th:action="@{/propietarios/guardar}" method="post" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Documento:</label>
                        <input type="text" name="document" required class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-sky-400" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Nombre Completo:</label>
                        <input type="text" name="name" required class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-sky-400" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Teléfono:</label>
                        <input type="text" name="phone" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-sky-400" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Dirección:</label>
                        <input type="text" name="address" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-sky-400" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Correo Electrónico:</label>
                        <input type="email" name="email" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-sky-400" />
                    </div>
                    <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 rounded-lg shadow transition text-sm">
                        Registrar Propietario
                    </button>
                </form>
            </div>

            <!-- Tabla de Propietarios -->
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-md border-2 border-sky-100">
                <h2 class="text-lg font-bold text-slate-700 mb-4">Lista de Propietarios Registrados</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse border border-slate-200">
                        <thead>
                            <tr class="bg-sky-50 border-b border-slate-200 text-xs font-bold text-slate-700 uppercase">
                                <th class="p-2.5 border">Doc</th>
                                <th class="p-2.5 border">Nombre</th>
                                <th class="p-2.5 border">Teléfono</th>
                                <th class="p-2.5 border text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 text-sm">
                            <tr th:each="o : ${propietarios}" class="hover:bg-slate-50 transition">
                                <td class="p-2.5 border font-medium text-slate-800" th:text="${o.document}"></td>
                                <td class="p-2.5 border text-slate-600" th:text="${o.name}"></td>
                                <td class="p-2.5 border text-slate-600" th:text="${o.phone}"></td>
                                <td class="p-2.5 border text-center">
                                    <a th:href="@{/propietarios/eliminar/{id}(id=${o.id})}" 
                                       onclick="return confirm('¿Seguro que deseas eliminar este propietario?');"
                                       class="bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-bold py-1 px-2.5 rounded transition">
                                       Eliminar 🗑️
                                   </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(propietarios)}">
                                <td colspan="4" class="p-6 text-center text-slate-400">No hay propietarios registrados todavía.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Alertas -->
        <div th:if="${exito}" class="p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded text-center text-sm font-semibold" th:text="${exito}"></div>
        <div th:if="${error}" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded text-center text-sm font-semibold" th:text="${error}"></div>
    </div>

</body>
</html>
