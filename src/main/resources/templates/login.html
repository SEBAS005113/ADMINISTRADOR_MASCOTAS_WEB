<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border-4 border-sky-200">
        <div class="text-center mb-6">
            <span class="text-4xl">🔐</span>
            <h1 class="text-2xl font-bold text-slate-700 mt-2">Acceso Administrador</h1>
            <p class="text-sm text-slate-500">Sistema de Gestión Veterinaria</p>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Usuario:</label>
                <input type="text" name="username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-400" placeholder="Ej. admin" />
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña:</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-400" placeholder="••••" />
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-lg shadow transition">
                Ingresar al Sistema
            </button>
        </form>

        <div class="mt-6" th:if="${error}">
            <div class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded text-center text-sm font-semibold" th:text="${error}"></div>
        </div>
    </div>

</body>
</html>
